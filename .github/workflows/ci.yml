name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Test Kick avatar parsing and URL safety
        run: bun test src/lib/kick-avatars.test.ts

      - name: Test social video embeds and captionless player URLs
        run: bun test src/lib/social-video.test.ts

      - name: Test Reel framing preferences
        run: bun test src/lib/instagram-framing.test.ts

      - name: Test automatic Instagram orientation
        run: bun test src/lib/instagram-auto-fit.test.ts

      - name: Test responsive Instagram video auto-fit
        run: bun test src/lib/instagram-video-fit.test.ts

      - name: Test Instagram video resolver and fallback
        run: bun test src/lib/instagram-cobalt.test.ts

      - name: Validate Cobalt authenticated gateway
        run: node --check infra/cobalt/gateway.mjs

      - name: Test Instagram authenticated gateway
        run: bun test src/lib/instagram-gateway.test.ts

      - name: Build production app
        run: bun run build
